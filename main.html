<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Верховне командування</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0b0a; --ink2:#17130f; --crimson:#b3141c; --gold:#c9a24b; --paper:#e7dcc3;
  --steel:#4f86a8; --olive:#7d8a45; --bronze:#8d6e3c; --ice:#a8dcff;
  --head:'Oswald','Arial Narrow',Impact,sans-serif; --body:'Spectral',Georgia,serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#24130e 0,transparent 42%),var(--ink);color:var(--paper);font-family:var(--body);position:relative;overflow-x:hidden}
/* rising sun rays */
body::before{content:"";position:absolute;inset:0 0 auto 0;height:720px;pointer-events:none;
  background:repeating-conic-gradient(from -90deg at 50% 0,rgba(179,20,28,.22) 0 5deg,transparent 5deg 10deg);
  -webkit-mask-image:radial-gradient(ellipse 60% 100% at 50% 0,#000 0,transparent 75%);mask-image:radial-gradient(ellipse 60% 100% at 50% 0,#000 0,transparent 75%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background:radial-gradient(rgba(231,220,195,.07) 1px,transparent 1.4px) 0 0/6px 6px}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;min-height:42px;padding:9px 20px;border-bottom:1px solid var(--gold);background:linear-gradient(90deg,#100d0b,#21150f 50%,#100d0b)}
header::before,header::after{content:"◆";position:absolute;top:50%;color:var(--gold);font-size:10px;transform:translateY(-50%)}
header::before{left:clamp(16px,4vw,48px)}header::after{right:clamp(16px,4vw,48px)}
.hdr-note{font-family:var(--head);letter-spacing:.22em;font-size:11px;color:var(--gold);text-align:center;text-transform:uppercase}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:36px 16px 64px;text-align:center}
.command-layout{position:relative;z-index:1;display:grid;grid-template-columns:minmax(240px,22vw) minmax(0,1fr) minmax(240px,22vw);gap:18px;align-items:start;padding:22px 18px 0;overflow:hidden}
.background-plane{position:absolute;z-index:0;opacity:.22;pointer-events:none;transform-origin:center;animation:plane-flight 18s ease-in-out infinite alternate}
.plane-one{top:56px;left:4%;width:min(19vw,290px);transform:rotate(-11deg)}
.plane-two{top:105px;left:76%;width:min(17vw,260px);opacity:.16;transform:rotate(11deg) scaleX(-1);animation-delay:-6s}
.plane-three{top:510px;left:72%;width:min(18vw,270px);opacity:.15;transform:rotate(-14deg);animation-delay:-12s}
.plane-four{top:650px;left:4%;width:min(17vw,250px);opacity:.12;transform:rotate(7deg) scaleX(-1);animation-delay:-3s}
@keyframes plane-flight{from{translate:-3% 2%}to{translate:8% -5%}}
.event-column{position:relative;z-index:1;min-width:0}
.background-ship{position:absolute;z-index:0;bottom:1000px;left:-56px;width:min(38vw,620px);height:auto;opacity:.72;pointer-events:none}
main{width:100%;min-width:0;padding:14px 8px 48px}
.event-panel{position:relative;align-self:start;margin-top:28px;padding:28px 22px 30px;color:#f0e5d1;text-align:left;background-color:#650e17;background-image:radial-gradient(rgba(255,224,155,.11) .7px,transparent .9px),repeating-linear-gradient(0deg,transparent 0 5px,rgba(18,3,5,.08) 5px 6px),linear-gradient(145deg,rgba(255,255,255,.08),rgba(0,0,0,.18));background-size:7px 7px,auto,auto;border:2px solid #d2a94e;outline:1px solid #c09a4b;outline-offset:4px}
.first-event-panel{width:100%;margin:28px 0 24px}
.panel-color{position:absolute;z-index:5;top:8px;right:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#fff0cf;background:#130c0caa;border:1px solid #e5c878;border-radius:3px;cursor:pointer;opacity:0;transition:opacity .16s}
.event-panel:hover .panel-color,.event-panel:focus-within .panel-color,.conspirators-panel:hover .panel-color,.conspirators-panel:focus-within .panel-color{opacity:1}
.panel-color input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.panel-color span{pointer-events:none;font-size:16px}
.event-panel::before{content:"";position:absolute;inset:10px;border:1px solid #e6c56b88;background:linear-gradient(#e6c56b,#e6c56b) left top/22px 2px,linear-gradient(#e6c56b,#e6c56b) left top/2px 22px,linear-gradient(#e6c56b,#e6c56b) right top/22px 2px,linear-gradient(#e6c56b,#e6c56b) right top/2px 22px,linear-gradient(#e6c56b,#e6c56b) left bottom/22px 2px,linear-gradient(#e6c56b,#e6c56b) left bottom/2px 22px,linear-gradient(#e6c56b,#e6c56b) right bottom/22px 2px,linear-gradient(#e6c56b,#e6c56b) right bottom/2px 22px;background-repeat:no-repeat;pointer-events:none}
.event-kicker{font:600 12px var(--head);letter-spacing:.17em;text-transform:uppercase;color:#e5c878;text-align:center}
.event-panel h2{position:relative;z-index:1;margin:12px 0 14px;text-align:center;font:600 25px var(--head);letter-spacing:.14em;text-transform:uppercase;color:#fff0cf}
.event-rule{position:relative;height:1px;margin:0 0 16px;background:linear-gradient(90deg,transparent,#e6c56b,transparent)}
.event-rule::after{content:"◆";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:0 8px;color:#e6c56b;background:#681018;font-size:12px}
.news-grid{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.news-card{position:relative;min-width:0;padding:9px;background:rgba(20,4,7,.3);border:1px solid #c9a24b}
.delete-card{position:absolute;z-index:3;right:5px;top:5px;width:25px;height:25px;border:1px solid #e5c878;background:#390910;color:#ffe9b2;font:600 17px var(--head);line-height:1;cursor:pointer}
.delete-card:hover{background:#a3141c}
.news-image{position:relative;display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/10;margin:0 0 12px;overflow:hidden;border:2px solid #d2a94e;background:linear-gradient(135deg,#3c1013,#7d171b 48%,#260a0d);cursor:pointer}
.news-image input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2}
.news-image img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.news-image.has img{display:block}
.news-image.has .image-placeholder{display:none}
.image-placeholder{font:600 13px var(--head);letter-spacing:.12em;text-transform:uppercase;color:#e5c878;text-align:center;padding:14px}
.image-placeholder span{display:block;font:32px var(--head);margin-bottom:5px;color:#f0d28b}
.news-title{font:600 18px var(--head);letter-spacing:.05em;text-align:center;color:#f4deb0;overflow-wrap:anywhere}
.news-copy{margin:10px 2px 0;font:15px/1.65 var(--body);color:#f0e5d1;overflow-wrap:anywhere}
.news-title:focus,.news-copy:focus{outline:1px dashed #f4d87e;outline-offset:3px}
.add-news-card{position:relative;z-index:1;display:block;margin:14px auto 0;padding:8px 14px;color:#fff0cf;background:#4c0b12;border:1px solid #d2a94e;font:600 14px var(--head);letter-spacing:.08em;cursor:pointer;opacity:0;transition:opacity .16s}
.first-event-panel:hover .add-news-card,.first-event-panel:focus-within .add-news-card{opacity:1}
.add-news-card:hover{background:#76111b}
.bottom-events{position:relative;z-index:1;padding:30px 0 52px;text-align:center}
.double-gold-separator{height:8px;width:100vw;margin:0 0 22px;border-top:2px solid #d6b45e;border-bottom:2px solid #9c762c}
.add-event-panel{margin:0 auto 24px;padding:10px 18px;color:#fff0cf;background:#4c0b12;border:1px solid #d2a94e;font:600 15px var(--head);letter-spacing:.08em;cursor:pointer}
.add-event-panel:hover{background:#76111b}
.bottom-event-panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),420px));justify-content:center;gap:18px;max-width:1500px;margin:0 auto}
.bottom-event-panel{position:relative;min-width:0;padding:24px 18px 20px;color:#f0e5d1;text-align:left;background-color:#650e17;background-image:radial-gradient(rgba(255,224,155,.11) .7px,transparent .9px),repeating-linear-gradient(0deg,transparent 0 5px,rgba(18,3,5,.08) 5px 6px),linear-gradient(145deg,rgba(255,255,255,.08),rgba(0,0,0,.18));background-size:7px 7px,auto,auto;border:2px solid #d2a94e;outline:1px solid #c09a4b;outline-offset:3px}
.bottom-event-panel .news-image{margin-top:8px}
.bottom-event-heading{margin:0 34px 10px 0;font:600 19px var(--head);letter-spacing:.08em;color:#fff0cf;overflow-wrap:anywhere}
.bottom-event-copy{margin:10px 2px 0;font:15px/1.65 var(--body);color:#f0e5d1;overflow-wrap:anywhere}
.bottom-event-heading:focus,.bottom-event-copy:focus{outline:1px dashed #f4d87e;outline-offset:3px}
h1{margin:0;font-family:var(--head);font-weight:700;font-size:clamp(30px,6vw,56px);letter-spacing:.06em;text-transform:uppercase}
.sub{margin:6px 0 0;font-style:italic;color:#b9ad92}
.tree{margin-top:26px;display:flex;flex-direction:column;align-items:center}
.node{display:flex;flex-direction:column;align-items:center;width:100%}
.disc{position:relative;width:240px;height:240px}
.disc.big{width:300px;height:300px}
.disc svg.deco{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.av{position:absolute;left:50%;top:50%;width:58.33%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;cursor:pointer;
  background:#1d1814;border:3px solid var(--c);outline:3px solid #080605;outline-offset:3px;
  display:flex;align-items:center;justify-content:center;transition:filter .15s}
.av:hover{filter:brightness(1.2)}
.av:focus-within{outline:3px solid var(--ice);outline-offset:4px}
.av input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.av.has img{display:block}
.av .ph{font-family:var(--head);font-size:12px;letter-spacing:.1em;color:#8b8068;text-align:center;line-height:1.5;pointer-events:none}
.av .ph svg{display:block;width:34px;margin:0 auto 4px}
.av.has .ph{display:none}
.plate{width:min(250px,100%);min-width:0;max-width:100%;margin-top:7px;padding:0;background:transparent;border:0;position:relative;clip-path:none}
.plate h2{display:flex;align-items:center;justify-content:center;min-height:35px;margin:0;padding:6px 18px;font-family:var(--head);font-weight:600;font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);background:linear-gradient(90deg,#100d0a,#231b13 50%,#100d0a);border-top:2px solid var(--c);border-bottom:2px solid var(--c);clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%)}
.nick{display:block;margin:0 14px;padding:4px 0 3px;border-bottom:1px solid color-mix(in srgb,var(--c) 75%,transparent);font-size:14px;color:var(--paper);outline:none;min-height:1.3em;font-style:italic}
.nick:empty::before{content:attr(data-ph);color:#6f6552}
.nick:focus{border-bottom:1px dashed var(--gold)}
/* connectors */
.v{width:3px;height:34px;background:var(--gold)}
.row{position:relative;display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-top:0}
.row::before{content:"";position:absolute;top:0;left:calc(100%/6);right:calc(100%/6);height:3px;background:var(--gold)}
.cell{position:relative;padding-top:34px;display:flex;justify-content:center}
.cell::before{content:"";position:absolute;top:0;left:50%;width:3px;height:34px;margin-left:-1.5px;background:var(--gold)}
.emp{--c:var(--gold)} .gen{--c:#d8383f} .adm{--c:var(--steel)} .min{--c:#b98f4a}
.cell{padding:34px 10px 0}
.cell .node{position:relative;overflow:hidden;max-width:340px;padding:22px 10px 132px;border:2px solid var(--c);background-color:#100e0b;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px),linear-gradient(#1b1712,#0b0a08);outline:1px solid #060504;outline-offset:3px;justify-content:flex-start}
.cell .node::before{content:"";position:absolute;inset:6px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(var(--c),var(--c)) left top/16px 1px,linear-gradient(var(--c),var(--c)) left top/1px 16px,linear-gradient(var(--c),var(--c)) right top/16px 1px,linear-gradient(var(--c),var(--c)) right top/1px 16px;background-repeat:no-repeat;opacity:.8;pointer-events:none}
.node>*{position:relative;z-index:1}
.scene{position:absolute!important;left:0;right:0;bottom:0;width:100%;height:120px;z-index:0!important}
.cr{position:absolute!important;top:14px;width:26px;height:26px;opacity:.9}
.cr.l{left:14px}.cr.r{right:14px}
.hat{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3}
.rank{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.rank span{font-family:'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN',serif;font-size:16px;letter-spacing:.18em;color:var(--paper)}
.royal{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,56px);width:100%;flex-wrap:wrap}
.royal .node{width:auto;flex:0 0 auto}
.flank{width:150px;text-align:center;font-family:'Noto Serif JP','Yu Mincho',serif;font-size:14px;letter-spacing:.2em;color:var(--gold)}
.flank svg{display:block;width:100%}
.conspirators-panel{position:sticky;z-index:4;top:62px;justify-self:end;width:min(100%,290px);height:auto;padding:18px 16px 24px;text-align:center;border:1px solid var(--gold);background:linear-gradient(160deg,#1b1510 0%,#0d0b0a 72%);transition:width .25s,padding .25s}
.conspirators-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px;padding-bottom:8px;border-bottom:1px solid #705820}
.conspirators-head h2{margin:0;font:600 22px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.panel-toggle{flex:none;width:30px;height:30px;border:1px solid var(--gold);background:linear-gradient(#292018,#100d0a);color:var(--gold);font:600 20px/1 var(--head);cursor:pointer}
.conspirators-panel.collapsed{width:54px;padding:18px 9px}
.conspirators-panel.collapsed{justify-self:end}
.conspirators-panel.collapsed .conspirators-head{justify-content:center;margin:0}
.conspirators-panel.collapsed .conspirators-head h2,.conspirators-panel.collapsed .conspirators{display:none}
.conspirators{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:10px}
.conspirator{display:flex;flex-direction:column;align-items:center}
.conspirator .disc{width:190px;height:190px}
.conspirator .av{border-color:#b3141c;outline:3px solid #b3141c;outline-offset:5px}
.conspirator .plate{min-width:190px;padding:6px 18px}
@media (max-width:900px){.command-layout{grid-template-columns:1fr;gap:12px;padding:16px 12px 0}.first-event-panel{width:min(100%,760px);margin:0 auto 18px}main{max-width:1000px;margin:0 auto}.conspirators-panel{grid-column:auto;position:relative;top:auto;justify-self:center;height:auto;width:100%;max-width:900px;margin:0 auto 20px}.conspirators{flex-direction:row;justify-content:center;flex-wrap:wrap}.conspirator .disc{width:160px;height:160px}}
@media (max-width:820px){.row{grid-template-columns:1fr;gap:0}.row::before{display:none}.cell{padding-top:20px}.cell::before{display:none}}
@media (max-width:820px){.royal .node{order:-1;flex-basis:100%}.flank{width:110px}}
footer{position:relative;z-index:1;text-align:center;padding:0 16px 32px;font-size:13px;color:#7d7360;font-style:italic}
@media (max-width:820px){.command-layout{gap:8px;padding:12px 10px 0}.row{grid-template-columns:1fr;gap:0}.conspirator .disc{width:150px;height:150px}.conspirator .plate{min-width:0;padding:6px 14px}.conspirator .plate h2{font-size:15px}}
@media (min-width:901px) and (max-height:1000px){
  .command-layout{gap:12px;padding-top:10px}
  .first-event-panel{margin:12px 0;padding:18px 14px 16px}
  .event-panel h2{margin:7px 0 9px;font-size:21px}.event-rule{margin-bottom:10px}
  .news-grid{gap:8px;margin-top:8px;grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}.news-card{padding:6px}
  .news-image{margin-bottom:7px;aspect-ratio:16/8}.news-title{font-size:15px}.news-copy{margin-top:6px;font-size:12px;line-height:1.35;overflow:visible}
  .image-placeholder{font-size:10px;padding:6px}.image-placeholder span{font-size:23px;margin-bottom:1px}
  main{padding-top:4px;padding-bottom:14px}h1{font-size:clamp(30px,3.4vw,46px)}.sub{margin-top:2px}.tree{margin-top:12px}
  .disc.big{width:228px;height:228px}.cell .disc{width:180px;height:180px}.royal{gap:22px}.flank{width:112px;font-size:12px}
  .v{height:20px}.cell{padding:20px 7px 0}.cell::before{height:20px}.row::before{height:2px}
  .cell .node{padding:8px 6px 88px}.scene{height:132px}.cr{top:6px;width:18px;height:18px}.cr.l{left:7px}.cr.r{right:7px}
  .plate{margin-top:4px;padding:5px 15px 6px}.plate h2{font-size:16px}.nick{font-size:13px}.rank{margin-top:6px;gap:6px}.rank span{font-size:13px}
  .conspirators-panel{top:50px;padding:12px 10px 14px}.conspirators-head{margin-bottom:7px}.conspirators-head h2{font-size:18px}.panel-toggle{width:28px;height:28px}
  .conspirators{gap:7px;margin-top:4px}.conspirator .disc{width:112px;height:112px}.conspirator .plate{min-width:158px;padding:4px 12px}.conspirator .plate h2{font-size:14px}.conspirator .nick{font-size:12px}
  .background-ship{bottom:0px;left:-48px;width:min(36vw,540px)}.plane-one{top:40px;width:min(18vw,230px);opacity:.2}.plane-two{top:120px}.plane-three{top:430px}.plane-four{top:610px}
  footer{display:none}
}
</style>
</head>
<body>
<header>
  <div class="hdr-note"></div>
</header>

<div class="command-layout">
<img class="background-plane plane-one" src="plane.png" alt="" aria-hidden="true">
<img class="background-plane plane-two" src="plane.png" alt="" aria-hidden="true">
<img class="background-plane plane-three" src="plane.png" alt="" aria-hidden="true">
<img class="background-plane plane-four" src="plane.png" alt="" aria-hidden="true">
<div class="event-column">
<aside class="event-panel first-event-panel" aria-labelledby="event-heading">
  <div class="event-kicker">Державний архів</div>
  <label class="panel-color" title="Змінити колір фону події"><span>◉</span><input type="color" data-panel-color="event" aria-label="Колір фону події"></label>
  <h2 id="event-heading" contenteditable="plaintext-only" data-event-field="heading">Подія</h2>
  <div class="event-rule"></div>
  <div class="news-grid" id="newsGrid"></div>
  <button class="add-news-card" id="addNewsCard" type="button">＋ Додати картку</button>
</aside>
</div>
<main>
  <h1>Верховне командування</h1>

  <div class="tree">
    <div class="royal"><div class="flank" id="flagBox"></div><div class="node emp"><div class="disc big" data-k="emp"></div><div class="plate"><h2>Імператор</h2><span class="nick" contenteditable="plaintext-only" data-ph="Нікнейм" data-k="emp"></span></div></div><div class="flank" id="crestBox"></div></div>
    <div class="v"></div>
    <div class="row">
      <div class="cell"><div class="node gen"><div class="disc" data-k="gen"></div><div class="plate"><h2>Головний Генерал</h2><span class="nick" contenteditable="plaintext-only" data-ph="Нікнейм" data-k="gen"></span></div></div></div>
      <div class="cell"><div class="node adm"><div class="disc" data-k="adm"></div><div class="plate"><h2>Гранд Адмірал</h2><span class="nick" contenteditable="plaintext-only" data-ph="Нікнейм" data-k="adm"></span></div></div></div>
      <div class="cell"><div class="node min"><div class="disc" data-k="min"></div><div class="plate"><h2>Міністр Внутрішніх справ</h2><span class="nick" contenteditable="plaintext-only" data-ph="Нікнейм" data-k="min"></span></div></div></div>
    </div>
  </div>
</main>
<aside class="conspirators-panel" aria-labelledby="conspirators-title">
    <label class="panel-color" title="Змінити колір фону коаліції"><span>◉</span><input type="color" data-panel-color="coalition" aria-label="Колір фону коаліції"></label>
    <div class="conspirators-head"><h2 id="conspirators-title">Анти-імператорська коаліція</h2><button class="panel-toggle" type="button" aria-label="Згорнути меню коаліції" aria-expanded="true">−</button></div>
    <div class="conspirators">
      <div class="conspirator"><div class="disc" data-k="con1"></div><div class="plate" style="--c:#d8383f"><h2>Змовник I</h2><span class="nick" contenteditable="plaintext-only" data-ph="Нікнейм" data-k="con1"></span></div></div>

bottomPanels.forEach(renderBottomPanel);document.getElementById('addEventPanel').addEventListener('click',function(){var panel={title:'Нова подія',copy:'Натисніть, щоб додати опис події.',img:''};bottomPanels.push(panel);renderBottomPanel(panel);saveBottomPanels()});
function setPanelTone(panel,color){if(panel.classList.contains('event-panel'))panel.style.backgroundColor=color;else panel.style.background=color;panel.style.removeProperty('border-color');panel.style.removeProperty('box-shadow')}
document.querySelectorAll('[data-panel-color]').forEach(function(input){var key='panelColor_'+input.dataset.panelColor,panel=input.closest('.event-panel,.conspirators-panel');if(store[key]){input.value=store[key];setPanelTone(panel,store[key])}input.addEventListener('input',function(){setPanelTone(panel,input.value);store[key]=input.value;save()})});
var cp=document.querySelector('.conspirators-panel'),toggle=cp.querySelector('.panel-toggle');toggle.addEventListener('click',function(){var collapsed=cp.classList.toggle('collapsed');toggle.setAttribute('aria-expanded',String(!collapsed));toggle.setAttribute('aria-label',collapsed?'Розгорнути меню коаліції':'Згорнути меню коаліції');toggle.textContent=collapsed?'+':'−'});
})();
</script>
